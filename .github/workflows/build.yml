name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build all modules
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload Fabric jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: clay-soldiers-reforged-fabric-java21
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev-shadow.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: clay-soldiers-reforged-neoforge-java21
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-dev-shadow.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
